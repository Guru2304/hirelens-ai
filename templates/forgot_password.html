{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
    <form class="glass-form" method="post">
        <p class="eyebrow">Password recovery</p>
        <h1>Send reset OTP</h1>
        <p class="muted">Enter your registered email. HireLens AI will send a 6-digit OTP using your configured Gmail SMTP account.</p>
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <button class="btn btn-primary full" type="submit"><i data-lucide="mail"></i>Send OTP</button>
    </form>
</section>
{% endblock %}
