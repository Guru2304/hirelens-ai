{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
    <form class="glass-form" method="post">
        <p class="eyebrow">Choose a new password</p>
        <h1>Reset Password</h1>
        <label>New Password<input type="password" name="password" required autocomplete="new-password"></label>
        <label>Confirm Password<input type="password" name="confirm_password" required autocomplete="new-password"></label>
        <button class="btn btn-primary full" type="submit"><i data-lucide="key-round"></i>Reset Password</button>
    </form>
</section>
{% endblock %}
